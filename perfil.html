<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayTrade - Perfil de Utilizador</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 flex flex-col justify-between">

    <header class="bg-white border-b border-gray-200 shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col md:flex-row items-center justify-between gap-4">
            
            <div class="flex items-center space-x-3 w-full md:w-auto justify-between md:justify-start">
                <a href="index.html" aria-label="Ir para a página inicial" class="flex items-center space-x-2">
                    <img src="img/logo.jpg" alt="Logótipo PlayTrade" class="h-12 w-auto object-contain">
                </a>
                <div class="flex space-x-2 md:hidden">
                    <a href="#" class="bg-gray-900 text-white text-xs px-3 py-1.5 rounded font-medium">Registar</a>
                    <a href="login.html" class="border border-gray-300 text-xs px-3 py-1.5 rounded font-medium">Entrar</a>
                </div>
            </div>

            <div class="w-full md:w-1/3 relative">
                <label for="pesquisa-perfil" class="sr-only">Pesquisar jogos</label>
                <input type="text" id="pesquisa-perfil" placeholder="Pesquisar jogos..." class="w-full bg-gray-100 border border-gray-300 rounded-lg py-1.5 pl-4 pr-10 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <nav class="hidden md:flex items-center space-x-6 text-sm font-medium text-gray-600">
                <a href="index.html" class="hover:text-blue-600 transition">Início</a>
                <a href="consola.html" class="hover:text-blue-600 transition">Consolas</a>
                <a href="adicionar.html" class="hover:text-blue-600 transition">Adicionar Jogo</a>
                <a href="perfil.html" class="text-blue-600 font-semibold" aria-current="page">Perfil</a>
            </nav>

            <div class="hidden md:flex items-center space-x-3">
                <a href="#" class="bg-gray-900 text-white text-sm px-4 py-2 rounded-lg font-medium hover:bg-gray-800 transition">Registar</a>
                <a href="login.html" class="border border-gray-300 text-sm px-4 py-2 rounded-lg font-medium hover:bg-gray-50 transition">Iniciar Sessão</a>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full pb-20 md:pb-6">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 items-start">
            
            <!-- Coluna da Esquerda: Identificação -->
            <aside class="bg-white border border-gray-200 rounded-xl p-6 shadow-sm flex flex-col items-center text-center h-full py-16">
                <div class="w-24 h-24 bg-gray-200 rounded-full flex items-center justify-center mb-3 overflow-hidden">
                    <img src="img/perfil.jpg" alt="Fotografia de perfil de Jony123" class="w-full h-full object-cover">
                </div>
                
                <h1 class="font-bold text-xl text-gray-900">Jony123</h1>
                <p class="text-md text-gray-500">João Francisco</p>
                <p class="text-md text-gray-500 flex mt-1"> Coimbra, Portugal </p>
            </aside>

            <!-- Coluna da Direita: Biblioteca -->
            <section class="md:col-span-3 bg-white border border-gray-200 rounded-xl p-6 shadow-sm">
                
                <div class="flex border-b border-gray-200 mb-6">
                    <button class="pb-3 px-4 text-sm font-bold text-blue-600 border-b-2 border-blue-600">Biblioteca</button>
                    <button class="pb-3 px-4 text-sm font-medium text-gray-500 hover:text-gray-700 transition">Wishlist</button>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                    <!-- Jogo 1 -->
                    <article class="bg-white border border-gray-200 rounded-lg p-3 hover:shadow-md hover:-translate-y-1 transition-all duration-300 cursor-pointer flex flex-col justify-between">
                        <div>
                            <div class="bg-gray-100 rounded-lg h-48 mb-3 flex items-center justify-center overflow-hidden p-2">
                                <img src="img/marvels-spider-man-ps4.jpg" alt="Capa Spider Man PS4" class="w-full h-full object-contain">
                            </div>
                            <h2 class="font-bold text-sm text-gray-900 line-clamp-2">Spider Man</h2>
                            <div class="mt-0.5">
                                <span class="text-[10px] bg-gray-800 text-white px-2 py-0.5 rounded font-semibold tracking-wider">PS4</span>
                            </div>
                        </div>
                        <div class="flex items-center justify-between mt-3 pt-2 border-t border-gray-100">
                            <span class="text-xs text-gray-900 font-semibold flex items-center">
                                Jony123
                            </span>
                            <span class="text-[10px] bg-yellow-100 text-yellow-700 px-2 py-0.5 rounded-full font-medium">Usado</span>
                        </div>
                    </article>

                    <!-- Jogo 2 -->
                    <article class="bg-white border border-gray-200 rounded-lg p-3 hover:shadow-md hover:-translate-y-1 transition-all duration-300 cursor-pointer flex flex-col justify-between">
                        <div>
                            <div class="bg-gray-100 rounded-lg h-48 mb-3 flex items-center justify-center overflow-hidden p-2">
                                <img src="img/need-for-speed-the-run-ps3.jpg" alt="Capa Need for Speed The Run PS3" class="w-full h-full object-contain">
                            </div>
                            <h2 class="font-bold text-sm text-gray-900 line-clamp-2">Need for Speed - The Run</h2>
                            <div class="mt-0.5">
                                <span class="text-[10px] bg-gray-800 text-white px-2 py-0.5 rounded font-semibold tracking-wider">PS3</span>
                            </div>
                        </div>
                        <div class="flex items-center justify-between mt-3 pt-2 border-t border-gray-100">
                            <span class="text-xs text-gray-900 font-semibold flex items-center">
                                Jony123
                            </span>
                            <span class="text-[10px] bg-green-100 text-green-700 px-2 py-0.5 rounded-full font-medium">Como Novo</span>
                        </div>
                    </article>
                </div>
            </section>
        </div>
    </main>

    <nav class="md:hidden bg-white border-t border-gray-200 fixed bottom-0 left-0 right-0 py-3 px-6 flex justify-between items-center z-50 text-xs font-medium text-gray-600 shadow-[0_-2px_10px_rgba(0,0,0,0.05)]">
        <a href="index.html" class="hover:text-blue-600 transition">Início</a>
        <a href="consola.html" class="hover:text-blue-600 transition">Consolas</a>
        <a href="adicionar.html" class="hover:text-blue-600 transition">Adicionar</a>
        <a href="perfil.html" class="text-blue-600 font-semibold transition">Perfil</a>
    </nav>

    <footer class="bg-white border-t border-gray-200 mt-16 py-8 text-xs text-gray-500">
        <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-4">
            <p>© 2026 PlayTrade</p>
            <div class="flex items-center gap-6 px-2">
                <a href="#" class="hover:text-gray-900 transition-colors">Projeto de Aplicações Web</a>
            </div>
        </div>
    </footer>
</body>
</html>
